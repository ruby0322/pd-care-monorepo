apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pd-care-dev

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: patch-configmap.yaml
  - path: patch-frontend.yaml
  - path: patch-backend.yaml
  - path: patch-ingress.yaml
  - path: patch-pvc-postgres.yaml
  - path: patch-pvc-seaweed-master.yaml
  - path: patch-pvc-seaweed-volume.yaml
  - path: patch-pvc-seaweed-filer.yaml

images:
  - name: pd-care-frontend
    newName: ghcr.io/ruby0322/pd-care-frontend
    newTag: dev-sha-f5516b626060
  - name: pd-care-backend
    newName: ghcr.io/ruby0322/pd-care-backend
    # Was sha-5fda651b7dfb, whose layer b410846cc72c is unservable from ghcr: it
    # fails immediately and identically from two independent daemons while the
    # other 15 layers pull fine, so the rollout could never converge. 6f230eb is
    # already cached on the node and 6f230eb..5fda651 touches only CI, Dockerfile
    # layer order and overlay tags -- no app code -- so this is the same backend.
    # A CD promotion supersedes this tag normally. Build that next image with the
    # gha cache bypassed once, or it will reuse the same unservable blob.
    newTag: sha-a50669966b5b
