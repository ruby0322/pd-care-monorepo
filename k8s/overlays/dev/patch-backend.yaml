apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  # A cold backend pull is ~1.2 GB over a slow link; the 600s default marks
  # the rollout failed (and ArgoCD Degraded) while the pull is still healthy.
  progressDeadlineSeconds: 3600
  template:
    spec:
      containers:
        - name: backend
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              path: /readyz
              port: 8000
            failureThreshold: 120
            periodSeconds: 10
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: 1
              memory: 2Gi
