apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-care-config
data:
  APP_ENV: "development"
  S3_BUCKET_NAME: "pd-care-dev-private"
  # Dev only. Base keeps this false so prod stays dark until deliberately enabled.
  # Requires OPENAI_API_KEY in the pd-care-secrets Secret, which is applied out of band.
  COPILOT_ENABLED: "true"
