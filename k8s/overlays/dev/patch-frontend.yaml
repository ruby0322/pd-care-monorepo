apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  # A cold frontend pull is ~230 MB, which already sits at the 600s default
  # on a slow link. Give it headroom so a healthy pull is not called a failure.
  progressDeadlineSeconds: 1800
  template:
    spec:
      containers:
        - name: frontend
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
