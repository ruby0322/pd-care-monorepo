apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pd-care-dev
  namespace: argocd
spec:
  project: pd-care
  source:
    repoURL: https://github.com/ruby0322/pd-care-monorepo.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: pd-care-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Keep ignoreDifferences fields out of the patch Argo CD sends, so a sync
      # for an unrelated reason does not strip Reloader's annotation (which would
      # itself bounce the pods).
      - RespectIgnoreDifferences=true
  # Reloader's `--reload-strategy=annotations` writes this pod-template
  # annotation on the workloads it restarts. It is live-only state, absent from
  # git, so `selfHeal: true` would otherwise revert it on every reload and
  # fight Reloader.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
