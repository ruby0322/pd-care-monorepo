# Opt-in public Argo CD UI. Do not apply on a campus-public operator IP;
# NTU CERT treats this as an exposed management console.
# Enable only with ARGOCD_EXPOSE_PUBLIC_UI=true on a private network.
# Default access: bash ops/deploy/argocd-ui-portforward.sh
# Tear down a live public UI: bash ops/security/unpublish_argocd_ui.sh
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argocd.pd.lu.im.ntu.edu.tw
      secretName: argocd-pd-lu-im-ntu-edu-tw-tls
  rules:
    - host: argocd.pd.lu.im.ntu.edu.tw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
